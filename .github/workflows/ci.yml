name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate and test the modules, validate the example
        run: make terraform
      - name: Lint
        run: |
          tflint --init
          make tflint

  sender:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats shellcheck
          pip install --quiet "ansible-core>=2.19,<3" "ansible-lint>=26,<27" "ruff>=0.16,<0.17"
      - name: Shellcheck
        run: make shellcheck
      - name: Ruff
        run: make ruff
      - name: Bats (scripts and role validation)
        run: make bats
      - name: Role render test
        run: make render
      - name: Build the collection, then lint the role and examples against it
        run: make ansible-lint

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The binary rather than gitleaks-action: the action needs API
      # permissions to list a PR's commits, and a licence key for
      # organisations. Pinned by version and checksum.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
      - name: Scan the full history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .
