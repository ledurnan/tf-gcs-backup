name: Release

# On a vX.Y.Z tag: build the Ansible collection and attach it to the
# GitHub release, creating the release if it doesn't exist. Consumers
# install the collection from that file by URL, never from git (ADR 0005).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the collection for
        required: true

permissions:
  contents: read

jobs:
  collection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install --quiet "ansible-core>=2.19,<3"
      - name: The collection version must match the tag
        run: |
          set -euo pipefail
          version="$(python3 -c 'import yaml; print(yaml.safe_load(open("ansible/galaxy.yml"))["version"])')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::ansible/galaxy.yml says ${version}, but the tag is ${TAG}"
            exit 1
          fi
      - name: Build the collection
        run: ansible-galaxy collection build ansible --output-path dist
      - name: Attach it to the release
        run: |
          set -euo pipefail
          file="$(ls dist/*.tar.gz)"
          sha256sum "$file"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
          else
            gh release create "$TAG" "$file" --verify-tag --title "$TAG" --generate-notes
          fi
