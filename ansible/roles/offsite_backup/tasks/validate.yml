---
# Refuse to enable a backup that is incomplete or wrong. Every check runs
# before anything changes on the host, and each message names the fix.
# Kept separate so tests can run it against localhost.

# v0.1 settings that no longer exist. Fail loudly rather than ignore
# them: someone setting a retention mode here expects it to do something.
- name: Assert no v0.1 settings remain
  ansible.builtin.assert:
    that:
      - offsite_backup_retention_mode is not defined
      - offsite_backup_bucket is not defined
    fail_msg: >-
      offsite_backup_retention_mode and offsite_backup_bucket were removed
      in v0.2. Each tier now has its own bucket, and its retention (and
      whether it is locked) is set in Terraform, never on the host:
      remove offsite_backup_retention_mode, and replace
      offsite_backup_bucket with offsite_backup_bucket_name_prefix (the
      module's bucket_name_prefix output). See docs/upgrading-to-v0.2.md.
    quiet: true

- name: Assert the required settings are present
  ansible.builtin.assert:
    that:
      - offsite_backup_bucket_name_prefix | length > 0
      - offsite_backup_tiers | length > 0
      - offsite_backup_age_recipients | length > 0
      - offsite_backup_sa_key | length > 0
      - offsite_backup_max_size | string | length > 0
      - (offsite_backup_paths | length > 0) or (offsite_backup_pre_command | length > 0)
    fail_msg: >-
      offsite_backup_enabled is true but the role is not fully configured.
      Required: offsite_backup_bucket_name_prefix, offsite_backup_tiers,
      offsite_backup_age_recipients,
      offsite_backup_sa_key, offsite_backup_max_size, and at least one of
      offsite_backup_paths or offsite_backup_pre_command.
    quiet: true

# GCS bucket names are at most 63 characters; each tier's is
# <prefix>-<tier name>.
- name: Assert every tier's bucket name is valid
  ansible.builtin.assert:
    that:
      - offsite_backup_bucket_name_prefix is match('^[a-z0-9][a-z0-9._-]*[a-z0-9]$')
      - (offsite_backup_bucket_name_prefix ~ '-' ~ item.name | default('')) | length <= 63
    fail_msg: >-
      Bucket {{ offsite_backup_bucket_name_prefix }}-{{ item.name | default('?') }}
      is not a valid bucket name: offsite_backup_bucket_name_prefix must be
      lowercase letters, digits, dots, hyphens and underscores, and each
      <prefix>-<tier> at most 63 characters. Use the module's
      bucket_name_prefix output.
    quiet: true
  loop: "{{ offsite_backup_tiers }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

- name: Assert the object prefix is a safe path segment
  ansible.builtin.assert:
    that:
      - offsite_backup_prefix is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
    fail_msg: >-
      offsite_backup_prefix '{{ offsite_backup_prefix }}' must be letters,
      digits, dots, hyphens and underscores; it becomes part of every
      object name.
    quiet: true

- name: Assert every age recipient is a public key
  ansible.builtin.assert:
    that:
      - offsite_backup_age_recipients | select('match', '^age1[0-9a-z]+$') | list | length
        == offsite_backup_age_recipients | length
    fail_msg: >-
      Every entry in offsite_backup_age_recipients must be an age public key
      (age1...). Never put a private key (AGE-SECRET-KEY-...) on the host.
    quiet: true

- name: Assert each tier is well formed
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name | string is match('^[a-z0-9][a-z0-9-]{0,30}$')
      - item.retain_days is defined and item.retain_days | string is match('^[1-9][0-9]*$')
      - item.when is defined and item.when is match('^(always|weekday:[1-7]|monthday:(0[1-9]|1[0-9]|2[0-8]))$')
      - item.name_format is not defined or (item.name_format | string | length > 0 and ' ' not in item.name_format)
    fail_msg: >-
      Tier {{ item }} is malformed. Each tier needs name (lowercase letters,
      digits and hyphens, matching the Terraform tier), retain_days (a whole
      number of at least 1), when (always, weekday:1-7 or monthday:01-28)
      and optionally name_format (a date format with no spaces).
    quiet: true
  loop: "{{ offsite_backup_tiers }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

- name: Assert tier names are unique
  ansible.builtin.assert:
    that:
      - offsite_backup_tiers | map(attribute='name') | unique | list | length == offsite_backup_tiers | length
    fail_msg: Tier names in offsite_backup_tiers must be unique.
    quiet: true

- name: Assert the lifecycle slack is a whole number
  ansible.builtin.assert:
    that:
      - offsite_backup_lifecycle_slack_days | string is match('^[0-9]+$')
    fail_msg: >-
      offsite_backup_lifecycle_slack_days must be a whole number of 0 or
      more, equal to the Terraform module's lifecycle_slack_days.
    quiet: true

- name: Assert the size guard settings are well formed
  ansible.builtin.assert:
    that:
      - offsite_backup_max_size | string is match('^[1-9][0-9]*[KMGT]?$')
      - offsite_backup_growth_min_size | string is match('^[0-9]+[KMGT]?$')
      - offsite_backup_max_growth_percent | string is match('^[0-9]+$')
    fail_msg: >-
      offsite_backup_max_size (more than 0) and offsite_backup_growth_min_size
      must be a whole number of bytes, optionally with K, M, G or T (powers
      of 1024), such as 2G. offsite_backup_max_growth_percent must be a
      whole number; 0 turns the growth check off.
    quiet: true

- name: Assert every path is absolute
  ansible.builtin.assert:
    that:
      - offsite_backup_paths | reject('match', '^/') | list | length == 0
    fail_msg: Every entry in offsite_backup_paths must be an absolute path.
    quiet: true

# A key pasted into an editor can have its long private_key line
# hard-wrapped, which is invalid JSON and fails only at run time, as an
# opaque auth error. Parse it now.
- name: Assert the service account key is valid JSON
  ansible.builtin.assert:
    that:
      - (offsite_backup_sa_key | from_json).type | default('') == 'service_account'
      - (offsite_backup_sa_key | from_json).private_key | default('') | length > 0
      - (offsite_backup_sa_key | from_json).client_email | default('') | length > 0
    fail_msg: >-
      offsite_backup_sa_key is not a usable service account key. If it was
      pasted into an editor, check the long private_key line wasn't
      hard-wrapped. Re-issue the key and store it without an editor rather
      than repairing it by hand.
    quiet: true
  no_log: true
